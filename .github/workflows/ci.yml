name: ci

on:
  push:
    branches: [dev, master]
  pull_request:

jobs:
  build-and-test:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Checkout pinned DataFrame
        uses: actions/checkout@v4
        with:
          repository: cloudQuant/DataFrame
          ref: 90aa4acf6437d5a34f7ab8dfb6e9250c3d53d230
          path: dataframe
      - name: Configure
        run: >
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          -DFINCORE_DATAFRAME_SOURCE_DIR=${{ github.workspace }}/dataframe
      - name: Build
        run: cmake --build build -j 4
      - name: Test
        run: ctest --test-dir build --output-on-failure
