{% extends "!layout.html" %}

{# sphinx_rtd_theme includes searchbox.html directly and ignores
   html_sidebars, so the language switcher is injected into its `menu` block. #}
{% block menu %}
  {{ super() }}
  <div class="fc-language-switch" role="navigation" aria-label="Language">
    <a href="{{ fc_docs_root }}en/latest/" data-fc-language="en">English</a>
    <span aria-hidden="true">|</span>
    <a href="{{ fc_docs_root }}zh-cn/latest/" data-fc-language="zh-cn">简体中文</a>
  </div>
{% endblock %}
