<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>fincore_cpp documentation</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  :root { color-scheme: light; }
  body {
    font-family: system-ui, -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    max-width: 34rem; margin: 16vh auto; padding: 0 1.5rem;
    line-height: 1.7; color: #1f2d3d; background: #ffffff;
  }
  h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
  p { color: #5a6b7b; }
  .choices { display: flex; gap: 0.75rem; margin: 1.6rem 0 1rem; }
  .choices a {
    flex: 1; text-align: center; padding: 0.7rem 1rem;
    border: 1px solid #d6dce1; border-radius: 0.6rem;
    color: #1f4e79; text-decoration: none; font-weight: 600;
    background: #f7fafc;
  }
  .choices a:hover { background: #eef4fa; border-color: #b8c9d9; }
  .hint { font-size: 0.86rem; color: #74818d; }
  code { font-size: 0.9em; }
</style>
</head>
<body>
<h1>fincore_cpp documentation</h1>
<p>One documentation site, two languages. 同一套文档，两种语言。</p>
<div class="choices">
  <a href="en/latest/" data-fc-language="en" hreflang="en">English</a>
  <a href="zh-cn/latest/" data-fc-language="zh-cn" hreflang="zh-CN">简体中文</a>
</div>
<p class="hint">
  Your choice is remembered; the pages carry a language switch in the top-right
  corner. 选择会被记住，页面右上角可随时切换语言。
</p>
<script>
  // Land in the reader's language on the first visit, then honour the switch they
  // last used. No-JavaScript visitors keep the two links above.
  (function () {
    "use strict";
    var stored = null;
    try { stored = window.localStorage.getItem("fincore-docs-language"); } catch (e) { stored = null; }
    var target = stored;
    if (!target) {
      var preferred = (navigator.languages && navigator.languages[0]) || navigator.language || "en";
      target = /^zh\b/i.test(preferred) ? "zh-cn" : "en";
    }
    var link = document.querySelector('[data-fc-language="' + target + '"]');
    if (link) { window.location.replace(link.getAttribute("href")); }
  })();
</script>
</body>
</html>
